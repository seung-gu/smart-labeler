<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Labeler</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #preview { border: 1px solid #a67b7b; margin: 10px 0; }
    button { padding: 10px 20px; font-size: 16px; }
    #result { margin-top: 20px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>📸 Smart Labeler</h1>
  <img id="preview" src="/frame" width="320" height="240" alt="Live Frame">
  <br>
  <button onclick="askLLM()">🔍 Ask Gemini</button>
  <div id="result">Result will appear here...</div>

  <script>
    setInterval(() => {
      document.getElementById("preview").src = "/frame?t=" + new Date().getTime();
    }, 2000);  // fetch new image every 2s

    async function askLLM() {
      const res = await fetch("/ask", { method: "POST" });
      console.log("raw response:", res);
      const data = await res.json();
      console.log("parsed JSON:", data);
      document.getElementById("result").innerText = data.keywords || "(No response)";
    }
  </script>
</body>
</html>
